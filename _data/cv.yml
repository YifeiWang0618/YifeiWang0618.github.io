    Experience:
      - company: ByteDance · Volcano Ark
        position: Product Solutions Intern
        location: Beijing, China
        start_date: 2026-04
        end_date: 2026-06
        summary: Enterprise AI products and MaaS solution design.
        highlights:
          - Mapped foundation-model capabilities to business scenarios and product delivery paths for enterprise AI solutions.

      - company: Research Collaboration with Tsinghua University
        position: Agent Memory Research · Co-author
        location: Beijing, China
        start_date: 2025-12
        end_date: 2026-05
        summary: Threader — a lossless long-term memory framework for conversational agents (NeurIPS 2026 under review).
        highlights:
          - Co-developed Threader to address information loss, latency, and cost in compression-based memory systems.
          - Introduced a topic-segmentation, multi-view encoding, and multi-signal retrieval pipeline that preserves complete conversations while improving efficiency and reducing token cost.
          - Outperformed representative systems including MemGPT and Mem0 on long-conversation memory benchmarks.

      - company: Beijing Institute of Technology
        position: Multimodal Learning & Neural Interpretability · Co-author
        location: Beijing, China
        start_date: 2025-09
        end_date: 2026-05
        summary: SAIL — sparse-autoencoder-based brain–model semantic alignment (NeurIPS 2026 under review).
        highlights:
          - Co-developed a sparse autoencoder framework for interpreting representations inside multimodal foundation models.
          - Disentangled high-dimensional visual features into monosemantic concepts and aligned them with fMRI signals from the human visual cortex.
          - Demonstrated that SAE features outperform raw model features in brain-alignment tasks.

