    Undergraduate in the Xu Teli Honors Program at Beijing Institute of Technology, majoring in Computer Science and Technology.
    Research interests include reinforcement learning with long-term memory, self-evolving models, recursive self-improvement,
    multimodal foundation models, and model interpretability.

